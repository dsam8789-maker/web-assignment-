<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Crown - Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>The Crown: Historical Gallery</h1>
        <p>A visual journey through the reign of Queen Elizabeth II.</p>
    </header>

    <main class="gallery-container">
        <!-- Image 1: Princess Diana -->
        <div class="image-card">
            <img src="image 2.webp" 
                 alt="Elizabeth Debicki as Princess Diana in The Crown Final Season" 
                 width="1000" 
                 height="1500" 
                 title="The Crown: The Final Season - Princess Diana"
                 class="crown-image">
            <p class="license">© Netflix. Educational/Editorial use only.</p>
        </div>

        <!-- Image 2: Queen Elizabeth (Profile) -->
        <div class="image-card">
            <img src="image 1.jpg" 
                 alt="Claire Foy in profile wearing the royal crown in silhouette" 
                 width="474" 
                 height="710" 
                 title="The Crown: Season 1 Official Poster"
                 class="crown-image">
            <p class="license">© Netflix. Educational/Editorial use only.</p>
        </div>

        <!-- Image 3: Season 2 Queen Elizabeth -->
        <div class="image-card">
            <img src="image 3.jpg" 
                 alt="Claire Foy as Queen Elizabeth II in Season 2, 1956-1964" 
                 width="1024" 
                 height="576" 
                 title="The Crown: Season 2 Visual"
                 class="crown-image">
            <p class="license">© Netflix. Educational/Editorial use only.</p>
        </div>
    </main>

</body>
</html>
